<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>3D RPG</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    canvas { display: block; touch-action: none; }
    #game-container { width: 100%; height: 100%; position: relative; }
    #loading-screen {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: #1a1a2e; display: flex; flex-direction: column;
      align-items: center; justify-content: center; z-index: 1000;
      transition: opacity 0.5s ease; color: #fff;
    }
    #loading-screen.hidden { opacity: 0; pointer-events: none; }
    #loading-bar-container {
      width: 60%; max-width: 300px; height: 8px;
      background: rgba(255,255,255,0.1); border-radius: 4px; margin-top: 16px; overflow: hidden;
    }
    #loading-bar {
      height: 100%; width: 0%; background: linear-gradient(90deg, #e94560, #0f3460);
      border-radius: 4px; transition: width 0.3s ease;
    }
    #loading-text { margin-top: 8px; font-size: 12px; color: rgba(255,255,255,0.5); }
    #loading-title { font-size: 24px; font-weight: 700; letter-spacing: 2px; }
  </style>
</head>
<body>
  <div id="loading-screen">
    <div id="loading-title">3D RPG</div>
    <div id="loading-bar-container"><div id="loading-bar"></div></div>
    <div id="loading-text">Loading assets...</div>
  </div>
  <div id="game-container"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
